name: Forecast Accuracy Gate

# The unit suite proves the engine runs. This proves it is still worth running.
#
# The gate is: FEPL must beat every clean, point-in-time baseline (trailing
# points-per-game and rolling means) on error AND on the decision metrics.
#
# The error half of the gate is RMSE, not MAE. FPL points are heavily
# right-skewed (mean 2.37, median 1), and a forecast minimises MAE at the median
# but RMSE at the mean. The optimiser sums expected points, so it needs the mean
# - gating on MAE actively rewarded under-prediction. Correcting the
# expected-assists conversion demonstrated it: bias improved at every price band
# and RMSE improved, while MAE got significantly worse.
#
# Error alone is not enough either. Averaged over ~300 players it is dominated by
# correctly predicting low scores and players who did not start, so a model can
# clear every baseline on error while being no better than trailing
# points-per-game at the two things FPL is actually won on: which fifteen players
# to own, and who to captain. So the gate also enforces within-position rank
# correlation.
#
# precision@15 and captain regret are reported as warnings but do NOT fail the
# build. That is a measured decision, not a hedge: over a full 2025-26 season a
# paired bootstrap puts FEPL-minus-baseline at +0.059 [-0.382, +0.500] on
# precision@15 and +0.147 [-1.235, +1.353] on captain regret. Both CIs span
# zero, so gating on them would fail builds at random.
#
# Two depths, because they answer different questions:
#
#   pull request / push  one season, GW8-16. Fast enough to block a merge on,
#                        and enough to catch a change that breaks the forecast.
#   weekly / dispatch    2022-23..2025-26, GW5-38, gated on the POOLED result.
#                        ~136 gameweeks, which is the sample size at which
#                        precision@15 and captain regret start to be
#                        measurable at all. Seasons before 2022-23 are excluded
#                        deliberately: they carry no expected_goals/assists, so
#                        they measure a different model. DefCon scoring is
#                        switched off automatically for seasons before 2025-26,
#                        when FPL did not award it.
#
# FPL's own `xP` column is reported for reference but never gates anything - it is
# scraped post-gameweek and zeroed for players who did not feature, so it leaks
# realised minutes.
#
# Beating the baselines is the floor, not the bar. Pooled, FEPL leads `ppg` by
# 0.154 RMSE and 0.127 rank correlation, so a change could hand back most of the
# edge this repo exists to find and still pass every check above, reported as a
# clean build. So the run is also measured against `gate_baseline.json`, the
# result this same configuration previously achieved, and fails if it is more
# than 1% worse. The PR and scheduled runs cover different seasons and gameweeks
# and each keeps its own record, keyed by configuration.
#
# A run with no record yet prints `[ -- ] ratchet` and does not fail, so adding a
# configuration does not need a baseline first. To move the bar deliberately -
# after a change that is expected to shift the numbers - re-record and commit it:
#
#   uv run python backtest.py --seasons 2025-26 --from-gw 8 --to-gw 16 \
#     --gate-metric rmse spearman --update-gate-baseline

on:
  push:
    branches: [main]
    paths:
      - '**.py'
      - '.github/workflows/accuracy_gate.yml'
  pull_request:
    paths:
      - '**.py'
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      seasons:
        description: 'Seasons to test'
        default: '2022-23 2023-24 2024-25 2025-26'
      from_gw:
        description: 'First gameweek'
        default: '5'
      to_gw:
        description: 'Last gameweek'
        default: '38'
      prior_season:
        description: "history_past source: auto, a season, or none"
        default: 'auto'

jobs:
  backtest:
    runs-on: ubuntu-latest
    # The deep run is ~136 gameweeks; the PR run is ~9.
    timeout-minutes: ${{ (github.event_name == 'pull_request' || github.event_name == 'push') && 45 || 180 }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Choose backtest depth
        id: depth
        run: |
          if [ -n "${{ github.event.inputs.seasons }}" ]; then
            echo "seasons=${{ github.event.inputs.seasons }}" >> "$GITHUB_OUTPUT"
            echo "from_gw=${{ github.event.inputs.from_gw }}"  >> "$GITHUB_OUTPUT"
            echo "to_gw=${{ github.event.inputs.to_gw }}"      >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "schedule" ]; then
            echo "seasons=2022-23 2023-24 2024-25 2025-26" >> "$GITHUB_OUTPUT"
            echo "from_gw=5"  >> "$GITHUB_OUTPUT"
            echo "to_gw=38"   >> "$GITHUB_OUTPUT"
          else
            echo "seasons=2025-26" >> "$GITHUB_OUTPUT"
            echo "from_gw=8" >> "$GITHUB_OUTPUT"
            echo "to_gw=16"  >> "$GITHUB_OUTPUT"
          fi

      - name: Walk-forward backtest with accuracy gate
        run: |
          uv run python backtest.py \
            --seasons ${{ steps.depth.outputs.seasons }} \
            --from-gw ${{ steps.depth.outputs.from_gw }} \
            --to-gw ${{ steps.depth.outputs.to_gw }} \
            --prior-season ${{ github.event.inputs.prior_season || 'auto' }} \
            --gate --gate-metric rmse spearman \
            --json-out backtest_results.json

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backtest-results
          path: backtest_results.json
