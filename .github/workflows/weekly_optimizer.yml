name: FEPL Weekly Optimizer

on:
  schedule:
    # Every day at 12:00 UTC, so prices, injuries and news stay current.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Restore the last good odds file
        # A fresh runner has no `data/odds`, so the on-disk fallback in
        # market_odds.py can only help here if the cache is carried between
        # runs. `key` is unique per run so the post-step always writes a new
        # entry, and `restore-keys` picks up the most recent previous one -
        # a rolling last-known-good copy. A restore counts as an access, so a
        # daily job keeps the entry from being evicted.
        #
        # Losing it is not a failure: without it an outage means flat team
        # ratings and a plan the publish gate refuses to promote. With it, an
        # outage costs only the most recent round of matches.
        uses: actions/cache@v4
        with:
          path: data/odds
          key: odds-${{ github.run_id }}
          restore-keys: |
            odds-

      - name: Unit tests
        # Offline only - the daily job must not fail because an external API
        # is briefly unavailable.
        run: uv run pytest tests/ -q

      - name: Run FEPL Weekly Manager
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
        run: uv run python weekly_manager.py --export-json public/weekly_plan.json

      - name: Should this replace the published plan?
        id: quality
        # Publishing is destructive - actions-gh-pages replaces the whole
        # directory - but refusing to publish silently serves whatever is
        # already there, which may belong to a gameweek that has been played.
        # `publish_gate` decides by gameweek, not by quality alone.
        run: |
          git fetch --depth=1 origin gh-pages || true
          git show origin/gh-pages:weekly_plan.json > /tmp/published.json 2>/dev/null || true
          uv run python publish_gate.py public/weekly_plan.json /tmp/published.json \
            | tee -a "$GITHUB_OUTPUT"
          if [ "$(grep -c '^publish=false' "$GITHUB_OUTPUT")" != "0" ]; then
            echo "::warning::Keeping the currently published plan; see reason above."
          fi

      - name: Send Discord notification
        # A failed notification should never block publishing the plan, and a
        # degraded plan should not be announced at all.
        if: steps.quality.outputs.publish == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python notify.py

      - name: Deploy JSON to GitHub Pages
        if: steps.quality.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
