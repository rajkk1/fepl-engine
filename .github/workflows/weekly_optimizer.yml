name: FEPL Weekly Optimizer

on:
  schedule:
    # Every day at 12:00 UTC, so prices, injuries and news stay current.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  # Write, for two pushes: the plan to `gh-pages`, and the forecast archive
  # (data/forecast_archive) to `main`.
  contents: write

# Two runs at once would both try to push the forecast archive, and the second
# would be rejected. Queue rather than cancel: a cancelled run before a deadline
# can be the one that held the last pre-deadline snapshot.
concurrency:
  group: weekly-optimizer
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Restore the last good odds file
        # `data/odds` is committed, so a fresh runner already has a floor;
        # this carries a *successful* fetch forward so later runs see the most
        # recent rounds rather than whatever was last committed. `key` is
        # unique per run so the post-step always writes a new entry, and
        # `restore-keys` picks up the most recent previous one - a rolling
        # last-known-good copy. A restore counts as an access, so a daily job
        # keeps the entry from being evicted.
        #
        # Losing it is a non-event: the committed floor and the mirror behind
        # it both remain. Freshness is judged from the newest match in the
        # file, not its mtime, so a restored or checked-out copy cannot claim
        # to be newer than it is.
        uses: actions/cache@v4
        with:
          path: data/odds
          key: odds-${{ github.run_id }}
          restore-keys: |
            odds-

      - name: Unit tests
        # Offline only - the daily job must not fail because an external API
        # is briefly unavailable.
        run: uv run pytest tests/ -q

      - name: Run FEPL Weekly Manager
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
        run: |
          uv run python weekly_manager.py --export-json public/weekly_plan.json \
            --archive-dir data/forecast_archive

      - name: Should this replace the published plan?
        id: quality
        # Publishing is destructive - actions-gh-pages replaces the whole
        # directory - but refusing to publish silently serves whatever is
        # already there, which may belong to a gameweek that has been played.
        # `publish_gate` decides by gameweek, not by quality alone.
        run: |
          git fetch --depth=1 origin gh-pages || true
          git show origin/gh-pages:weekly_plan.json > /tmp/published.json 2>/dev/null || true
          uv run python publish_gate.py public/weekly_plan.json /tmp/published.json \
            | tee -a "$GITHUB_OUTPUT"
          if [ "$(grep -c '^publish=false' "$GITHUB_OUTPUT")" != "0" ]; then
            echo "::warning::Keeping the currently published plan; see reason above."
          fi

      - name: Send Discord notification
        # A failed notification should never block publishing the plan, and a
        # degraded plan should not be announced at all.
        if: steps.quality.outputs.publish == 'true'
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python notify.py

      - name: Deploy JSON to GitHub Pages
        if: steps.quality.outputs.publish == 'true'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public

      - name: Archive the pre-deadline forecast
        # The forecast for every player, FPL's own `ep_next`, and the outcomes
        # of finished gameweeks, committed to `main` under data/forecast_archive.
        # Neither the forecast nor `ep_next` can be recovered once the deadline
        # passes, and the live API forgets a season each summer, so the Actions
        # cache - evictable - is the wrong home for it. forecast_archive.py
        # decides what may be written; this step only commits it.
        #
        # Last, so a failed push cannot stop the plan publishing, and
        # `!cancelled()` so it still runs when a later step failed: the snapshot
        # is written before the optimiser runs. A failure here fails the run,
        # visibly, because a week not archived is lost.
        #
        # A push made with GITHUB_TOKEN triggers no workflows, so these commits
        # do not set off the test suite on `main`.
        #
        # Only the archive is committed. A successful odds fetch rewrites the
        # tracked data/odds files in the working tree, which is why the rebase
        # needs --autostash; those changes are never committed from here.
        if: ${{ !cancelled() }}
        run: |
          mkdir -p data/forecast_archive
          git add data/forecast_archive
          if git diff --cached --quiet; then
            echo "::warning::No forecast snapshot was written this run - see 'Run FEPL Weekly Manager'."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -q -m "archive: forecast snapshot $(date -u +%Y-%m-%dT%H:%MZ)"
          for attempt in 1 2 3; do
            if git pull -q --rebase --autostash origin main && git push -q origin HEAD:main; then
              git log -1 --stat --format='%h %s'
              exit 0
            fi
            sleep $((attempt * 15))
          done
          echo "::error::Could not push the forecast archive to main after 3 attempts."
          exit 1
