name: FEPL Weekly Optimizer

on:
  schedule:
    # Every day at 12:00 UTC, so prices, injuries and news stay current.
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python
        run: uv python install 3.12

      - name: Unit tests
        # Offline only - the daily job must not fail because an external API
        # is briefly unavailable.
        run: uv run pytest tests/ -q

      - name: Run FEPL Weekly Manager
        env:
          FPL_TEAM_ID: ${{ secrets.FPL_TEAM_ID }}
          FPL_COOKIE: ${{ secrets.FPL_COOKIE }}
        run: uv run python weekly_manager.py --export-json public/weekly_plan.json

      - name: Send Discord notification
        # A failed notification should never block publishing the plan.
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: uv run python notify.py

      - name: Deploy JSON to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
