[project]
name = "fepl"
version = "0.1.0"
description = "Fantasy Premier League (FPL) Multi-Gameweek Team Optimizer & Transfer Planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pulp>=2.8.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

