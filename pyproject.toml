[project]
name = "fepl"
version = "0.1.0"
description = "Fantasy Premier League (FPL) Multi-Gameweek Team Optimizer & Transfer Planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pulp>=2.8.0",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "thefuzz>=0.22.1",
    # thefuzz's optional C backend. Not imported directly; without it thefuzz
    # falls back to pure Python and warns on every club-name match.
    "Levenshtein>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

