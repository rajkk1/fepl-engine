[project]
name = "fepl"
version = "0.1.0"
description = "Fantasy Premier League (FPL) Multi-Gameweek Team Optimizer & Transfer Planner"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # PuLP is the modelling layer. The solver is HiGHS, not the CBC binary PuLP
    # bundles: `PULP_CBC_CMD` is slated for removal in PuLP 4.0, and the binary
    # is x86_64 only, so an arm64 Mac without Rosetta rejects it and cannot run
    # the optimiser at all. Pinned below 4 until the modelling API there is
    # known-good, since this allowed `pulp>=2.8.0` and a routine bump would
    # otherwise have taken the daily job out.
    "pulp>=3.0,<4",
    # The solver itself. A hard dependency rather than a fallback: two solvers
    # means two sets of answers, and the season replay compares totals across
    # machines.
    "highspy>=1.11",
    "numpy>=1.26.0",
    "pandas>=2.0.0",
    "requests>=2.31.0",
    "httpx>=0.27.0",
    "python-dotenv>=1.0.0",
    "scipy>=1.15.3",
    "scikit-learn>=1.7.2",
    "thefuzz>=0.22.1",
    # thefuzz's optional C backend. Not imported directly; without it thefuzz
    # falls back to pure Python and warns on every club-name match.
    "Levenshtein>=0.25.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

